{% extends "layouts/base.html" %}

{% block title %}

Add Companies

{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header">

            <h3>

                Add Companies to

                {{ campaign.campaign_name }}

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <table class="table table-hover">

                    <thead>

                    <tr>

                        <th></th>

                        <th>Company</th>

                        <th>Email</th>

                        <th>Country</th>

                    </tr>

                    </thead>

                    <tbody>

                    {% for company in companies %}

                    <tr>

                        <td>

                            <input
                                type="checkbox"
                                name="company_ids"
                                value="{{ company.id }}">

                        </td>

                        <td>

                            {{ company.company_name }}

                        </td>

                        <td>

                            {{ company.email }}

                        </td>

                        <td>

                            {{ company.country }}

                        </td>

                    </tr>

                    {% endfor %}

                    </tbody>

                </table>

                <button
                    class="btn btn-success">

                    Add Selected Companies

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
