{% extends "layouts/base.html" %}

{% block title %}Import Report{% endblock %}

{% block content %}

<h2>Import Complete</h2>

<div class="row">

    <div class="col-md-4">

        <div class="card">

            <div class="card-body">

                <h6>Imported</h6>

                <h2>{{ report.created }}</h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card">

            <div class="card-body">

                <h6>Skipped</h6>

                <h2>{{ report.skipped }}</h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card">

            <div class="card-body">

                <h6>Errors</h6>

                <h2>{{ report.errors|length }}</h2>

            </div>

        </div>

    </div>

</div>

<div class="mt-4">

    <a href="{{ url_for('import_center.upload') }}"
       class="btn btn-primary">

        Import Another File

    </a>

</div>

{% endblock %}
